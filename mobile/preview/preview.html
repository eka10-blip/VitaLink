<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>VitaLink — Person 4 Interactive Preview</title>
<style>
:root{--ink:#172b29;--muted:#647773;--green:#137c65;--bg:#f5f8f7;--border:#e0ebe7}*{box-sizing:border-box}body{margin:0;background:#e3ece9;color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.app{max-width:440px;min-height:100dvh;background:var(--bg);margin:0 auto;box-shadow:0 5px 55px #162c2321;display:flex;flex-direction:column}.sticky{position:sticky;top:0;background:var(--bg);z-index:2;padding:16px 20px 9px}.head{display:flex;align-items:center;justify-content:space-between}.brand{font-size:23px;font-weight:900;letter-spacing:-1px}.brand span{color:var(--green)}.brandicon{display:inline-grid;place-items:center;background:var(--green);color:#fff;border-radius:10px;width:34px;height:34px;vertical-align:middle;margin-right:7px}.badge{display:inline-block;padding:6px 10px;border-radius:30px;background:#fff0e4;color:#b76027;font-size:10px;font-weight:900;letter-spacing:.4px}.switch{display:flex;background:#e8efeb;border-radius:13px;padding:4px;margin-top:16px}.switch button{flex:1;border:0;border-radius:11px;background:transparent;color:var(--muted);font-weight:800;font-size:12px;padding:10px 3px;cursor:pointer}.switch button.sel{background:white;color:var(--green);box-shadow:0 1px 3px #0001}.content{padding:13px 20px 85px;flex:1}.kicker{color:var(--muted);font-weight:600}.title{font-size:31px;line-height:1.1;font-weight:900;margin:3px 0 8px;letter-spacing:-.6px}.lead{color:var(--muted);font-size:13px;margin:0 0 24px}.panel{background:white;border:1px solid var(--border);border-radius:20px;padding:19px;margin-bottom:13px}.hero{background:#eaf6f0;border-color:#dbeee4}.hero h2{font-size:24px;line-height:1.2;letter-spacing:-.3px}.panel h3{font-size:17px;margin:13px 0 6px}.panel p{font-size:13px;color:var(--muted);line-height:1.6;margin:6px 0 14px}.flag{display:inline-block;background:#d6efe3;color:var(--green);padding:6px 10px;border-radius:20px;font-size:10px;font-weight:900;letter-spacing:.5px}.flag.blue{background:#eaf3ff;color:#2c688a}.flag.red{background:#fff1f0;color:#b54c52}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.section{font-size:18px;font-weight:900;margin:23px 0 11px}.button{background:var(--green);color:white;border:0;border-radius:14px;padding:15px 14px;width:100%;font-size:14px;font-weight:800;cursor:pointer}.button.secondary{color:var(--green);background:#e6f5ef;border:1px solid var(--green)}.button.danger{background:#b54c52}.metrics{display:flex;gap:10px}.metric{flex:1;border-radius:18px;padding:16px;min-width:0;background:#e8f7ef}.metric.blue{background:#eaf3ff}.metric .label{font-size:12px;color:var(--muted);font-weight:700}.metric .num{font-size:37px;font-weight:900;margin:9px 0}.metric .num small{font-size:12px;font-weight:400;color:var(--muted)}.metric .desc{font-size:11px;color:var(--muted)}.item{display:flex;gap:12px;align-items:center;padding:9px 0}.dot{width:9px;height:9px;border-radius:50%;background:var(--green);flex-shrink:0}.item b{font-size:13px}.item p{margin:0;font-size:11px}.small{font-size:11px;color:var(--muted)}.note{font-size:11px;color:var(--muted);line-height:1.6;margin:13px 0}.nav{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--border);display:flex;justify-content:space-around;padding:7px 0 13px;z-index:3}.nav button{flex:1;border:0;background:transparent;font-size:11px;color:#839890;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}.nav .glyph{font-size:25px;line-height:1.1}.nav button.sel{color:var(--green);font-weight:900}.avatar{background:#e6f5ef;color:var(--green);border-radius:17px;padding:13px;font-weight:900}.rule{height:1px;background:var(--border);margin:13px 0}.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:85px;max-width:400px;width:90%;padding:13px;border-radius:12px;background:#1e4a3e;color:white;box-shadow:0 8px 20px #0003;opacity:0;pointer-events:none;transition:opacity .3s}.toast.on{opacity:1}@media(min-width:900px){.app{margin:24px auto;min-height:calc(100dvh - 48px);border-radius:26px;overflow:hidden}}
</style></head>
<body><main class="app"><header class="sticky"><div class="head"><div class="brand"><span class="brandicon">♥</span>Vita<span>Link</span></div><span class="badge">DEMO · FICTIONAL</span></div><div class="switch"><button id="patientRole" class="sel" onclick="chooseRole('patient')">Patient view</button><button id="careRole" onclick="chooseRole('caregiver')">Family dashboard</button></div></header><div class="content" id="content"></div><nav class="nav" id="nav"></nav></main><div id="toast" class="toast" role="status" aria-live="polite"></div>
<script>
let role='patient',tab='Home';let events=[{date:'Today, 9:30 AM',note:'Feeling well today.',pulse:72,breathing:16}];let pulse=72,breathing=16;let alerts=[];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const words={patient:['Home','Check-in','Reports'],caregiver:['Overview','Alerts','Reports']};
function badge(label,tone=''){return `<span class="flag ${tone}">${esc(label)}</span>`}
function chooseRole(next){role=next;tab=words[role][0];render()}
function chooseTab(next){tab=next;render()}
function say(msg){const t=document.querySelector('#toast');t.textContent=msg;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),3500)}
function doCheck(){pulse=75;breathing=17;events.unshift({date:'Just now',note:'Sample check-in completed.',pulse,breathing});say('Synthetic check-in saved. View the family dashboard to see it.');render()}
function doAlert(){alerts.unshift({id:Date.now(),date:'Just now',title:'Simulated fall follow-up',detail:'Test scenario: no reply to a follow-up question. No real fall was detected.',ack:false});say('Simulated alert created. Switch to the caregiver Alerts tab.');render()}
function ack(id){const a=alerts.find(a=>a.id===id);if(a)a.ack=true;say('Alert marked as reviewed. This does not contact emergency services.');render()}
function metrics(){return `<div class="section row"><span>Latest measurements</span><span class="small">Synthetic sample data</span></div><div class="metrics"><div class="metric"><div class="label">♥ Heart rate</div><div class="num">${pulse}<small> bpm</small></div><div class="desc">Sample reading</div></div><div class="metric blue"><div class="label">〰 Breathing rate</div><div class="num">${breathing}<small> /min</small></div><div class="desc">Sample reading</div></div></div><p class="note">These are fictional sample values, not camera measurements or a medical diagnosis.</p>`}
function history(){return `<div class="section">Previous check-ins</div><div class="panel">${events.slice(0,8).map((e,i)=>`${i?'<div class="rule"></div>':''}<div class="item"><div class="dot"></div><div><b>${esc(e.date)}</b><p>${esc(e.note)}</p></div></div>`).join('')}</div>`}
function patientHome(){return `<div class="kicker">Good to see you,</div><h1 class="title">Evelyn <span style="color:#137c65">✳</span></h1><p class="lead">A little check-in can go a long way.</p><div class="panel hero">${badge('YOUR DAILY CHECK-IN')}<h2>How are you feeling today?</h2><p>Check in at your pace and share an update with your care team.</p><button class="button" onclick="chooseTab('Check-in')">Try a demo check-in →</button></div>${metrics()}<div class="section">Your care connection</div><div class="panel"><div class="item"><div class="dot"></div><div><b>Jordan Carter</b><p>Linked family caregiver</p></div></div></div><p class="note">Prototype only. Not for diagnosis or emergency response.</p>`}
function patientCheck(){return `<h1 class="title">Daily check-in</h1><p class="lead">A simple process, with you in control.</p><div class="panel">${badge('STEP 1')}<h3>Camera measurements</h3><p>Presage + LiveKit will send estimated vital measurements. This interface displays the results supplied by Person 2.</p><div class="row"><span class="small">Heart rate</span><b>${pulse} bpm (sample)</b></div><div class="row"><span class="small">Breathing</span><b>${breathing}/min (sample)</b></div></div><div class="panel">${badge('STEP 2','blue')}<h3>Voice conversation</h3><p>Chert + ElevenLabs provide the actual voice conversation and transcript through Person 1's service. Voice connection is not implemented in this preview.</p></div><div class="panel">${badge('STEP 3')}<h3>Shared update</h3><p>Gemini + Supabase will provide the patient and caregiver summaries.</p><button class="button" onclick="doCheck()">Complete sample check-in</button></div><div class="panel"><h3>Emergency-flow simulation</h3><p>Trigger a test nonresponse event. This is not real-world fall detection.</p><button class="button danger" onclick="doAlert()">Simulate no-response alert</button></div>`}
function caregiverHome(){let pending=alerts.filter(a=>!a.ack);return `<div class="kicker">Family dashboard</div><h1 class="title">Stay connected <span style="color:#137c65">♥</span></h1><p class="lead">Updates from your loved one's daily care.</p><div class="panel row"><div class="avatar">EC</div><div style="flex:1"><b>Evelyn Carter</b><p>Linked family member</p></div>${badge('CONNECTED')}</div>${metrics()}<div class="section row"><span>Attention center</span><span class="small">${pending.length} awaiting review</span></div><div class="panel"><h3 style="color:${pending.length?'#b54c52':'#137c65'}">${pending.length?pending.length+' follow-up alert(s)':'All caught up'}</h3><p>${pending.length?esc(pending[0].detail):'No unanswered alerts are currently recorded.'}</p><button class="button secondary" onclick="chooseTab('Alerts')">View alerts →</button></div>${history()}`}
function alertsScreen(){return `<h1 class="title">Care alerts</h1><p class="lead">Check-in events that may need personal follow-up.</p>${alerts.length?alerts.map(a=>`<div class="panel">${badge(a.ack?'REVIEWED':'NEEDS REVIEW',a.ack?'':'red')} ${badge('SIMULATION')}<h3>${esc(a.title)}</h3><p>${esc(a.detail)}</p><div class="small">${esc(a.date)}</div>${a.ack?'':'<button style="margin-top:12px" class="button" onclick="ack('+a.id+')">Mark as reviewed</button>'}</div>`).join(''):'<div class="panel"><h3>No alerts right now</h3><p>If the backend records an escalation, it will appear here.</p></div>'}<p class="note">Marking an alert reviewed does not check on a patient or contact emergency services.</p>`}
function reports(){return `<h1 class="title">Health reports</h1><p class="lead">Summaries from your latest check-in.</p><div class="panel">${badge('LATEST REPORT')}<h3>${role==='patient'?'Your check-in summary':'Caregiver summary'}</h3><p>${role==='patient'?'Your latest demo check-in was completed. Your sample measurements were saved.':'Evelyn completed a synthetic check-in. Sample pulse: '+pulse+' bpm; breathing: '+breathing+'/min. '+alerts.filter(a=>!a.ack).length+' alert(s) awaiting review.'}</p><p class="note">Fictional sample report. Not generated clinical interpretation.</p></div>${history()}`}
function render(){document.querySelector('#patientRole').classList.toggle('sel',role==='patient');document.querySelector('#careRole').classList.toggle('sel',role==='caregiver');document.querySelector('#content').innerHTML=role==='patient'?(tab==='Home'?patientHome():tab==='Check-in'?patientCheck():reports()):(tab==='Overview'?caregiverHome():tab==='Alerts'?alertsScreen():reports());document.querySelector('#nav').innerHTML=words[role].map((n,i)=>`<button class="${n===tab?'sel':''}" onclick="chooseTab('${n}')"><span class="glyph">${i===0?'⌂':i===1?(role==='patient'?'♡':'⚑'):'▤'}</span>${n}</button>`).join('')}
render();
</script></body></html>
